<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奶糖機器人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        /* 眼睛容器 */
        #face {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12vw;
            position: relative;
        }

        .eye {
            width: 28vw;
            height: 28vw;
            max-width: 180px;
            max-height: 180px;
            background: #ffffff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        .pupil {
            width: 45%;
            height: 45%;
            background: #222;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.15s ease;
        }

        /* 眨眼動畫 */
        .eye.blink {
            animation: blink 0.18s ease-in-out;
        }
        @keyframes blink {
            0%   { transform: scaleY(1); }
            50%  { transform: scaleY(0.1); }
            100% { transform: scaleY(1); }
        }

        /* 不同狀態的眼睛變化 */
        body.listening .pupil {
            background: #4fc3f7;
        }
        body.thinking .pupil {
            background: #ffb74d;
            width: 35%;
            height: 35%;
        }
        body.speaking .pupil {
            background: #81c784;
        }
        body.error .pupil {
            background: #e57373;
        }

        /* 底部控制區（連線成功後會隱藏） */
        #controls {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.5s;
        }
        #controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        button {
            background: #4fc3f7;
            color: #1a1a2e;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            min-width: 220px;
        }
        button:active {
            transform: scale(0.97);
        }
        #statusText {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }

        /* 隱藏的除錯日誌（長按眼睛可顯示） */
        #log {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-size: 12px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
            z-index: 20;
        }
        #log.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="face">
        <div class="eye" id="leftEye"><div class="pupil"></div></div>
        <div class="eye" id="rightEye"><div class="pupil"></div></div>
    </div>

    <div id="controls">
        <button id="connectBtn">連接奶糖</button>
        <div id="statusText">請點擊上方按鈕連接機器人</div>
    </div>

    <div id="log"></div>

    <script>
        // ===================== 請修改這裡 =====================
        const GEMINI_API_KEY = "AQ.Ab8RN6Leob4Gef3eM70-7H58W7bukTQaSn_T4cy4aUf70wUUVgY";   // 換成你的 Gemini API Key
        const BLE_SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const BLE_CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26aae";
        // ======================================================

        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;
        let recognition = null;
        let isListening = false;
        let isConnected = false;

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const controls = document.getElementById('controls');
        const logEl = document.getElementById('log');
        const leftEye = document.getElementById('leftEye');
        const rightEye = document.getElementById('rightEye');

        function log(msg) {
            console.log(msg);
            logEl.innerHTML += `> ${msg}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 眨眼
        function blink() {
            leftEye.classList.add('blink');
            rightEye.classList.add('blink');
            setTimeout(() => {
                leftEye.classList.remove('blink');
                rightEye.classList.remove('blink');
            }, 180);
        }

        // 定期眨眼
        setInterval(() => {
            if (Math.random() > 0.4) blink();
        }, 2800 + Math.random() * 2000);

        // 設定表情狀態
        function setState(state) {
            document.body.className = state || '';
        }

        // ===================== 藍牙 =====================
        connectBtn.addEventListener('click', async () => {
            try {
                statusText.innerText = "正在搜尋二白...";
                setState('thinking');

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    // 除錯階段建議先用 acceptAllDevices
                    acceptAllDevices: true,
                    optionalServices: [BLE_SERVICE_UUID]
                    // 正式使用可改回：
                    // filters: [{ namePrefix: 'ErBai' }],
                    // optionalServices: [BLE_SERVICE_UUID]
                });

                log(`選擇裝置: ${bluetoothDevice.name || '未知'}`);
                statusText.innerText = "連接中...";

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);

                isConnected = true;
                statusText.innerText = "已連接，可以開始說話";
                setState('');
                log("藍牙連線成功");

                // 連線成功後隱藏控制區，進入全表情模式
                setTimeout(() => {
                    controls.classList.add('hidden');
                }, 1500);

                // 自動開始語音
                startListening();

                // 監聽斷線
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (err) {
                log(`藍牙錯誤: ${err}`);
                statusText.innerText = "連接失敗，請再點一次";
                setState('error');
            }
        });

        function onDisconnected() {
            isConnected = false;
            bluetoothCharacteristic = null;
            controls.classList.remove('hidden');
            statusText.innerText = "連線中斷，請重新連接";
            setState('error');
            stopListening();
            log("藍牙已斷線");
        }

        async function sendCommand(cmd) {
            if (!bluetoothCharacteristic) {
                log("尚未連線，無法發送: " + cmd);
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(cmd));
                log(`發送指令: ${cmd}`);
            } catch (err) {
                log(`發送失敗: ${err}`);
            }
        }

        // ===================== 語音辨識 =====================
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusText.innerText = "此瀏覽器不支援語音辨識";
                return;
            }

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = true;      // 持續聽
