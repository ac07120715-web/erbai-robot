<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>二白陪伴機器人 - 主控介面</title>
  <style>
    body {
      margin: 0;
      background-color: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
    }
    /* 表情 Canvas */
    canvas {
      background-color: #050505;
      border-radius: 20px;
    }
    /* 狀態與對話文字框 */
    #status {
      margin-top: 15px;
      font-size: 20px;
      color: #00E5FF;
      text-align: center;
      padding: 0 20px;
      min-height: 30px;
    }
    /* 藍牙連線按鈕 */
    #btButton {
      margin-top: 20px;
      background-color: #FF6D00;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 109, 0, 0.4);
    }
    #btButton.connected {
      background-color: #00C853;
    }
  </style>
</head>
<body>

  <!-- 二白的靈動大眼畫布 -->
  <canvas id="faceCanvas" width="400" height="250"></canvas>
  
  <!-- 對話與聆聽狀態提示 -->
  <div id="status">點擊螢幕任意處開始對話</div>

  <!-- 藍牙連線按鈕 -->
  <button id="btButton" onclick="connectBluetooth()">連接二白底盤 (Bluetooth)</button>

 <script>
    // === 1. Google Gemini API 設定 ===
    // 請填入您的 Google AI Studio (Gemini) API Key
    const GEMINI_API_KEY = "AQ.Ab8RN6Leob4Gef3eM70-7H58W7bukTQaSn_T4cy4aUf70wUUVg"; 
    // 使用反應最快的 Flash 模型
    const GEMINI_MODEL = "gemini-2.5-flash";

    // === 2. 藍牙全域變數 ===
    let bluetoothDevice;
    let bluetoothServer;
    let btCharacteristic;
    // ESP32 序列埠藍牙的標準 UUID
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

    // === 3. 動態表情系統 (HTML5 Canvas) ===
    const canvas = document.getElementById('faceCanvas');
    const ctx = canvas.getContext('2d');
    
    let emotion = 'normal'; // 'normal', 'listening', 'happy', 'thinking'
    let eyeYScale = 1.0; 

    function drawFace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#FFFFFF";

      const eyeWidth = 45;
      const eyeHeight = 65 * eyeYScale;
      const eyeY = 125 - eyeHeight / 2;

      if (emotion === 'happy') {
        // 開心表情 (^ ^ 彎彎眼)
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(120, 125, 30, Math.PI, 0, false);
        ctx.arc(280, 125, 30, Math.PI, 0, false);
        ctx.stroke();
      } else if (emotion === 'listening') {
        // 聆聽中 (雙眼變亮藍色)
        ctx.fillStyle = "#00E5FF";
        ctx.beginPath();
        ctx.arc(120, 125, 35 * eyeYScale, 0, Math.PI * 2);
        ctx.arc(280, 125, 35 * eyeYScale, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 正常與思考 (圓形大眼睛)
        ctx.beginPath();
        ctx.ellipse(120, 125, eyeWidth / 2, Math.max(2, eyeHeight / 2), 0, 0, Math.PI * 2);
        ctx.ellipse(280, 125, eyeWidth / 2, Math.max(2, eyeHeight / 2), 0, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(drawFace);
    }

    // 自動眨眼邏輯
    function triggerBlink() {
      if (emotion === 'happy') {
        setTimeout(triggerBlink, 3000);
        return;
      }
      let duration = 150; 
      let startTime = Date.now();

      let blinkInterval = setInterval(() => {
        let elapsed = Date.now() - startTime;
        if (elapsed < duration / 2) {
          eyeYScale = 1 - (elapsed / (duration / 2));
        } else if (elapsed < duration) {
          eyeYScale = (elapsed - duration / 2) / (duration / 2);
        } else {
          eyeYScale = 1.0;
          clearInterval(blinkInterval);
          setTimeout(triggerBlink, Math.random() * 4000 + 2000);
        }
      }, 16);
    }

    drawFace();
    triggerBlink();

    // === 4. Web Bluetooth 連線控制 ===
    async function connectBluetooth() {
      const btn = document.getElementById('btButton');
      try {
        btn.innerText = "搜尋中...";
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ErBai_Robot' }], // 對應我們燒錄在 ESP32 上的藍牙名稱
          optionalServices: [SERVICE_UUID]
        });

        bluetoothServer = await bluetoothDevice.gatt.connect();
        const service = await bluetoothServer.getPrimaryService(SERVICE_UUID);
        btCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        btn.innerText = "藍牙已連線 🤖";
        btn.classList.add('connected');
      } catch (error) {
        console.error("藍牙連線失敗: ", error);
        btn.innerText = "連線失敗，點擊重試";
      }
    }

    // 發送指令給 ESP32 底盤
    async function sendBluetoothCommand(cmd) {
      if (btCharacteristic) {
        try {
          const encoder = new TextEncoder();
          await btCharacteristic.writeValue(encoder.encode(cmd));
          console.log("已發送藍牙指令: " + cmd);
        } catch (err) {
          console.error("發送指令失敗: ", err);
        }
      }
    }

    // === 5. 語音辨識 (STT) 與對話流程 ===
    const statusDiv = document.getElementById('status');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;

      recognition.onstart = () => {
        emotion = 'listening';
        statusDiv.innerText = "👂 二白正在聽你說...";
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        statusDiv.innerText = `你說: "${text}"`;
        emotion = 'normal';
        
        // 呼叫 OpenAI API
        await askChatGPT(text);
      };

      recognition.onend = () => {
        if(emotion === 'listening') emotion = 'normal';
      };
    } else {
      alert("此瀏覽器不支援語音辨識，請使用 Chrome！");
    }

    // 點擊畫面任意處即可開始對話
    document.body.addEventListener('click', (e) => {
      // 避免點擊按鈕時觸發
      if(e.target.id === 'btButton') return;
      if (recognition) {
        try { recognition.start(); } catch(err) {}
      }
    });

    // === 6. 呼叫 OpenAI API ===
    async function askChatGPT(userPrompt) {
      statusDiv.innerText = "💭 二白思考中...";
      emotion = 'thinking';

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              {
                role: "system", 
                content: "你是二白，一個可愛奶萌、說話簡短的陪伴機器人。回答請控制在20字以內。如果你覺得開心請在句尾加上 [HAPPY]。如果主人叫你向前或過來，請在句尾加上 [MOVE_F]。如果叫你後退加上 [MOVE_B]。"
              },
              { role: "user", content: userPrompt }
            ]
          })
        });

        const data = await response.json();
        let aiReply = data.choices[0].message.content;

        // 解析標籤並觸發動作
        if (aiReply.includes("[HAPPY]")) {
          emotion = 'happy';
          aiReply = aiReply.replace("[HAPPY]", "").trim();
        }
        if (aiReply.includes("[MOVE_F]")) {
          sendBluetoothCommand('F'); // 傳送前進指令給 ESP32
          aiReply = aiReply.replace("[MOVE_F]", "").trim();
          setTimeout(() => sendBluetoothCommand('S'), 1500); // 1.5秒後自動停止
        }
        if (aiReply.includes("[MOVE_B]")) {
          sendBluetoothCommand('B'); // 傳送後退指令
          aiReply = aiReply.replace("[MOVE_B]", "").trim();
          setTimeout(() => sendBluetoothCommand('S'), 1500);
        }

        statusDiv.innerText = `🤖 二白: ${aiReply}`;
        speak(aiReply);

      } catch (err) {
        statusDiv.innerText = "⚠️ 網路或 API 發生錯誤！";
        console.error(err);
        emotion = 'normal';
      }
    }

    // === 7. 語音合成 (TTS 發聲) ===
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.pitch = 1.5; // 高音調，呈現可愛萌音
      utterance.rate = 1.0;

      utterance.onend = () => {
        if(emotion !== 'happy') emotion = 'normal';
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
